# =============================================================================
# DeskFlow — Security & Code-Quality CI Pipeline
# =============================================================================
#
# Security:
#   Code Coverage     -> Vitest
#   Dependency Audit  -> npm audit
#   SAST              -> Semgrep
#   Secret Scanning   -> Gitleaks CLI
#   Report            -> PDF
#   Storage           -> GitHub Actions Artifact
#
# =============================================================================

name: Security & Code-Quality CI

on:
  push:
    branches:
      - feature/DF_083_Quality_gates_in_CI

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 85
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.28.0"

jobs:

  security-pipeline:

    name: Security & Quality Pipeline

    runs-on: ubuntu-latest

    steps:

      # =====================================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full Git history is required for complete Gitleaks Git scanning
          fetch-depth: 0


      # =====================================================================
      # 2. INSTALL GITLEAKS CLI
      # =====================================================================

      - name: Install Gitleaks CLI
        shell: bash
        run: |

          echo "Installing Gitleaks version ${GITLEAKS_VERSION}..."

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz

          sudo mv gitleaks /usr/local/bin/gitleaks

          rm -f gitleaks.tar.gz

          echo "Gitleaks installed successfully."

          gitleaks version


      # =====================================================================
      # 3. RUN GITLEAKS SECRET SCAN
      # =====================================================================

      - name: Run Gitleaks Secret Scan
        id: gitleaks
        shell: bash

        run: |

          echo "Running Gitleaks secret scan..."

          # ---------------------------------------------------------------
          # Disable immediate shell failure.
          #
          # Gitleaks returns:
          #   0 -> no secrets detected
          #   1 -> secrets detected
          #   other -> scan/runtime error
          #
          # We capture the result and let the final CI gate decide whether
          # the complete workflow should fail.
          # ---------------------------------------------------------------

          set +e

          gitleaks git . \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact

          GITLEAKS_EXIT_CODE=$?

          set -e


          # ---------------------------------------------------------------
          # Count findings from JSON report
          # ---------------------------------------------------------------

          GITLEAKS_FINDINGS=$(python3 - <<'PY'
          import json
          import os

          path = "gitleaks-report.json"

          try:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as file:
                      data = json.load(file)

                  print(len(data) if isinstance(data, list) else 0)
              else:
                  print(0)

          except Exception:
              print(0)
          PY
          )


          echo "GITLEAKS_FINDINGS=$GITLEAKS_FINDINGS" \
            >> "$GITHUB_OUTPUT"


          # ---------------------------------------------------------------
          # Evaluate Gitleaks result
          # ---------------------------------------------------------------

          if [ "$GITLEAKS_EXIT_CODE" -eq 0 ]; then

            echo "GITLEAKS_PASS=true" \
              >> "$GITHUB_OUTPUT"

            echo "GITLEAKS_SCAN_ERROR=false" \
              >> "$GITHUB_OUTPUT"

            echo "Gitleaks scan PASSED."
            echo "No potential secrets detected."


          elif [ "$GITLEAKS_EXIT_CODE" -eq 1 ]; then

            echo "GITLEAKS_PASS=false" \
              >> "$GITHUB_OUTPUT"

            echo "GITLEAKS_SCAN_ERROR=false" \
              >> "$GITHUB_OUTPUT"

            echo "::warning::Gitleaks detected $GITLEAKS_FINDINGS potential secret(s)."


          else

            echo "GITLEAKS_PASS=false" \
              >> "$GITHUB_OUTPUT"

            echo "GITLEAKS_SCAN_ERROR=true" \
              >> "$GITHUB_OUTPUT"

            echo "::warning::Gitleaks scan encountered an error. Exit code: $GITLEAKS_EXIT_CODE"

          fi


          echo "Gitleaks findings: $GITLEAKS_FINDINGS"

          # Do not fail here.
          # Final CI quality gate will determine final status.

          exit 0


      # =====================================================================
      # 4. SETUP NODE.JS
      # =====================================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"


      # =====================================================================
      # 5. INSTALL PROJECT DEPENDENCIES
      # =====================================================================

      - name: Install dependencies
        run: npm ci


      # =====================================================================
      # 6. DETECT TEST CASES
      # =====================================================================

      - name: Detect test cases
        id: detect_tests
        shell: bash

        run: |

          echo "Searching for test files..."

          TEST_FILES=$(find . \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/dist/*" \
            \( \
              -name "*.test.js" \
              -o -name "*.test.jsx" \
              -o -name "*.test.ts" \
              -o -name "*.test.tsx" \
              -o -name "*.spec.js" \
              -o -name "*.spec.jsx" \
              -o -name "*.spec.ts" \
              -o -name "*.spec.tsx" \
            \) 2>/dev/null || true)


          if [ -n "$TEST_FILES" ]; then

            echo "Test files found:"

            echo "$TEST_FILES"

            echo "HAS_TESTS=true" \
              >> "$GITHUB_OUTPUT"

          else

            echo "No test files found."

            echo "HAS_TESTS=false" \
              >> "$GITHUB_OUTPUT"

          fi


      # =====================================================================
      # 7. INSTALL VITEST + COVERAGE
      # =====================================================================

      - name: Install Vitest and coverage provider
        if: steps.detect_tests.outputs.HAS_TESTS == 'true'

        run: |

          npm install --no-save \
            vitest@2 \
            @vitest/coverage-v8@2


      # =====================================================================
      # 8. RUN CODE COVERAGE
      # =====================================================================

      - name: Run Vitest coverage
        id: vitest

        if: steps.detect_tests.outputs.HAS_TESTS == 'true'

        shell: bash

        run: |

          npx vitest run \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=json-summary \
            --coverage.reporter=text \
            --reporter=json \
            --outputFile=vitest-results.json \
            2>&1 | tee vitest-output.txt || true


          COVERAGE_FILE="coverage/coverage-summary.json"


          if [ -f "$COVERAGE_FILE" ]; then

            ACTUAL=$(node -e "
              const s = require('./coverage/coverage-summary.json');
              console.log(s.total.lines.pct);
            ")


            echo "ACTUAL_COVERAGE=$ACTUAL" \
              >> "$GITHUB_OUTPUT"


            THRESHOLD=${{ env.COVERAGE_THRESHOLD }}


            PASS=$(awk \
              -v a="$ACTUAL" \
              -v t="$THRESHOLD" \
              'BEGIN {
                print (a >= t) ? "true" : "false"
              }')


            echo "COVERAGE_PASS=$PASS" \
              >> "$GITHUB_OUTPUT"


            echo "Coverage: $ACTUAL%"
            echo "Threshold: $THRESHOLD%"
            echo "Coverage Pass: $PASS"


          else

            echo "WARNING: coverage-summary.json not found."


            echo "ACTUAL_COVERAGE=unknown" \
              >> "$GITHUB_OUTPUT"


            echo "COVERAGE_PASS=unknown" \
              >> "$GITHUB_OUTPUT"

          fi


      # =====================================================================
      # 9. DEPENDENCY AUDIT
      # Tool: npm audit
      # =====================================================================

      - name: Run npm dependency audit
        id: npm_audit
        shell: bash

        run: |

          echo "Running npm dependency security audit..."


          # ---------------------------------------------------------------
          # Human-readable output
          # ---------------------------------------------------------------

          npm audit || true


          # ---------------------------------------------------------------
          # JSON report for PDF generation
          # ---------------------------------------------------------------

          npm audit --json > npm-audit.json 2>&1 || true


          # ---------------------------------------------------------------
          # Count High + Critical vulnerabilities
          # ---------------------------------------------------------------

          HIGH=$(node -e "

            try {

              const report =
                require('./npm-audit.json');

              const vulnerabilities =
                report.metadata?.vulnerabilities || {};

              const high =
                vulnerabilities.high || 0;

              const critical =
                vulnerabilities.critical || 0;

              console.log(high + critical);

            } catch(error) {

              console.log(0);

            }

          ")


          echo "HIGH_CRITICAL_COUNT=$HIGH" \
            >> "$GITHUB_OUTPUT"


          # ---------------------------------------------------------------
          # Dependency quality gate
          # ---------------------------------------------------------------

          if [ "$HIGH" -gt 0 ]; then

            echo "AUDIT_PASS=false" \
              >> "$GITHUB_OUTPUT"

            echo "::warning::npm audit found $HIGH High/Critical vulnerabilities."

          else

            echo "AUDIT_PASS=true" \
              >> "$GITHUB_OUTPUT"

            echo "npm audit passed."

          fi


      # =====================================================================
      # 10. SETUP PYTHON
      # =====================================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # =====================================================================
      # 11. INSTALL SEMGREP + REPORTLAB
      # =====================================================================

      - name: Install security and report dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            semgrep==1.90.0 \
            reportlab==4.2.5


      # =====================================================================
      # 12. SEMGREP SAST SCAN
      # =====================================================================

      - name: Run Semgrep SAST scan
        id: semgrep
        shell: bash

        run: |

          echo "Running Semgrep SAST scan..."


          semgrep \
            --config=p/javascript \
            --config=p/react \
            --json \
            --output=semgrep-results.json \
            --exclude=node_modules \
            --exclude=dist \
            . || true


          # ---------------------------------------------------------------
          # Count ERROR severity findings
          # ---------------------------------------------------------------

          SEMGREP_ERRORS=$(node -e "

            try {

              const report =
                require('./semgrep-results.json');

              const findings =
                report.results || [];

              const errors =
                findings.filter(f =>
                  (f.extra?.severity || '')
                  .toUpperCase() === 'ERROR'
                ).length;

              console.log(errors);

            } catch(error) {

              console.log(0);

            }

          ")


          # ---------------------------------------------------------------
          # Count total findings
          # ---------------------------------------------------------------

          SEMGREP_TOTAL=$(node -e "

            try {

              const report =
                require('./semgrep-results.json');

              console.log(
                (report.results || []).length
              );

            } catch(error) {

              console.log(0);

            }

          ")


          echo "SEMGREP_TOTAL=$SEMGREP_TOTAL" \
            >> "$GITHUB_OUTPUT"


          echo "SEMGREP_ERRORS=$SEMGREP_ERRORS" \
            >> "$GITHUB_OUTPUT"


          # ---------------------------------------------------------------
          # Semgrep Quality Gate
          # ---------------------------------------------------------------

          if [ "$SEMGREP_ERRORS" -gt 0 ]; then

            echo "SEMGREP_PASS=false" \
              >> "$GITHUB_OUTPUT"

            echo "::warning::Semgrep found $SEMGREP_ERRORS ERROR-level findings."

          else

            echo "SEMGREP_PASS=true" \
              >> "$GITHUB_OUTPUT"

          fi


          echo "Semgrep scan completed."

          echo "Total findings: $SEMGREP_TOTAL"

          echo "ERROR findings: $SEMGREP_ERRORS"


      # =====================================================================
      # 13. GENERATE PDF SECURITY REPORT
      # =====================================================================

      - name: Generate PDF security report

        if: always()

        shell: bash

        env:

          # Repository information

          REPO_NAME: ${{ github.repository }}

          BRANCH_NAME: ${{ github.ref_name }}

          COMMIT_SHA: ${{ github.sha }}

          RUN_ID: ${{ github.run_id }}

          RUN_NUMBER: ${{ github.run_number }}


          # Coverage information

          HAS_TESTS: ${{ steps.detect_tests.outputs.HAS_TESTS }}

          ACTUAL_COVERAGE: ${{ steps.vitest.outputs.ACTUAL_COVERAGE }}

          COVERAGE_PASS: ${{ steps.vitest.outputs.COVERAGE_PASS }}

          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}


          # Dependency audit information

          AUDIT_PASS: ${{ steps.npm_audit.outputs.AUDIT_PASS }}

          HIGH_CRITICAL: ${{ steps.npm_audit.outputs.HIGH_CRITICAL_COUNT }}


          # Semgrep information

          SEMGREP_TOTAL: ${{ steps.semgrep.outputs.SEMGREP_TOTAL }}

          SEMGREP_ERRORS: ${{ steps.semgrep.outputs.SEMGREP_ERRORS }}

          SEMGREP_PASS: ${{ steps.semgrep.outputs.SEMGREP_PASS }}


          # Gitleaks information

          GITLEAKS_PASS: ${{ steps.gitleaks.outputs.GITLEAKS_PASS }}

          GITLEAKS_FINDINGS: ${{ steps.gitleaks.outputs.GITLEAKS_FINDINGS }}

          GITLEAKS_SCAN_ERROR: ${{ steps.gitleaks.outputs.GITLEAKS_SCAN_ERROR }}


        run: |

          echo "Generating PDF security report..."

          python .github/scripts/generate_report.py


      # =====================================================================
      # 14. COLLECT SECURITY REPORTS
      # =====================================================================

      - name: Collect security reports

        if: always()

        shell: bash

        run: |

          mkdir -p security-reports


          # ---------------------------------------------------------------
          # PDF Report
          # ---------------------------------------------------------------

          if [ -f security-report.pdf ]; then

            cp security-report.pdf \
              security-reports/

          fi


          # ---------------------------------------------------------------
          # npm Audit JSON
          # ---------------------------------------------------------------

          if [ -f npm-audit.json ]; then

            cp npm-audit.json \
              security-reports/

          fi


          # ---------------------------------------------------------------
          # Semgrep JSON
          # ---------------------------------------------------------------

          if [ -f semgrep-results.json ]; then

            cp semgrep-results.json \
              security-reports/

          fi


          # ---------------------------------------------------------------
          # Gitleaks JSON
          # ---------------------------------------------------------------

          if [ -f gitleaks-report.json ]; then

            cp gitleaks-report.json \
              security-reports/

          fi


          # ---------------------------------------------------------------
          # Coverage Report
          # ---------------------------------------------------------------

          if [ -d coverage ]; then

            cp -r coverage \
              security-reports/coverage

          fi


          echo ""

          echo "Generated security reports:"

          echo ""

          ls -lh security-reports/


      # =====================================================================
      # 15. UPLOAD REPORTS AS GITHUB ACTIONS ARTIFACT
      # =====================================================================

      - name: Upload security reports artifact

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: Security-Baseline-Report

          path: security-reports/

          retention-days: 30

          if-no-files-found: warn


      # =====================================================================
      # 16. FINAL CI QUALITY GATE
      # =====================================================================

      - name: Evaluate final CI gate

        if: always()

        shell: bash

        env:

          # Coverage

          HAS_TESTS: ${{ steps.detect_tests.outputs.HAS_TESTS }}

          COVERAGE_PASS: ${{ steps.vitest.outputs.COVERAGE_PASS }}

          ACTUAL_COVERAGE: ${{ steps.vitest.outputs.ACTUAL_COVERAGE }}

          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}


          # Dependency audit

          AUDIT_PASS: ${{ steps.npm_audit.outputs.AUDIT_PASS }}

          HIGH_CRITICAL: ${{ steps.npm_audit.outputs.HIGH_CRITICAL_COUNT }}


          # Semgrep

          SEMGREP_PASS: ${{ steps.semgrep.outputs.SEMGREP_PASS }}

          SEMGREP_ERRORS: ${{ steps.semgrep.outputs.SEMGREP_ERRORS }}


          # Gitleaks

          GITLEAKS_PASS: ${{ steps.gitleaks.outputs.GITLEAKS_PASS }}

          GITLEAKS_FINDINGS: ${{ steps.gitleaks.outputs.GITLEAKS_FINDINGS }}

          GITLEAKS_SCAN_ERROR: ${{ steps.gitleaks.outputs.GITLEAKS_SCAN_ERROR }}


        run: |

          FAIL=false


          echo "========================================="

          echo "        FINAL CI GATE EVALUATION         "

          echo "========================================="


          # ===============================================================
          # COVERAGE
          # ===============================================================

          if [ "$HAS_TESTS" = "true" ]; then

            if [ "$COVERAGE_PASS" = "false" ]; then

              echo "❌ Coverage FAILED"

              echo "$ACTUAL_COVERAGE% < $COVERAGE_THRESHOLD%"

              FAIL=true


            elif [ "$COVERAGE_PASS" = "true" ]; then

              echo "✅ Coverage PASSED"

              echo "$ACTUAL_COVERAGE% >= $COVERAGE_THRESHOLD%"


            else

              echo "⚠️ Coverage result unknown."

              FAIL=true

            fi


          else

            echo "⏭️ Coverage SKIPPED — no test cases found."

          fi


          # ===============================================================
          # DEPENDENCY AUDIT
          # ===============================================================

          if [ "$AUDIT_PASS" = "false" ]; then

            echo "❌ Dependency Audit FAILED"

            echo "$HIGH_CRITICAL High/Critical vulnerabilities found."

            FAIL=true


          elif [ "$AUDIT_PASS" = "true" ]; then

            echo "✅ Dependency Audit PASSED"


          else

            echo "⚠️ Dependency Audit result unknown."

            FAIL=true

          fi


          # ===============================================================
          # SEMGREP SAST
          # ===============================================================

          if [ "$SEMGREP_PASS" = "false" ]; then

            echo "❌ Semgrep SAST FAILED"

            echo "$SEMGREP_ERRORS ERROR-level findings found."

            FAIL=true


          elif [ "$SEMGREP_PASS" = "true" ]; then

            echo "✅ Semgrep SAST PASSED"


          else

            echo "⚠️ Semgrep SAST result unknown."

            FAIL=true

          fi


          # ===============================================================
          # GITLEAKS SECRET SCAN
          # ===============================================================

          if [ "$GITLEAKS_SCAN_ERROR" = "true" ]; then

            echo "❌ Gitleaks Secret Scan ERROR"

            echo "Gitleaks was unable to complete the scan."

            FAIL=true


          elif [ "$GITLEAKS_PASS" = "false" ]; then

            echo "❌ Gitleaks Secret Scan FAILED"

            echo "$GITLEAKS_FINDINGS potential secret(s) detected."

            FAIL=true


          elif [ "$GITLEAKS_PASS" = "true" ]; then

            echo "✅ Gitleaks Secret Scan PASSED"

            echo "0 potential secrets detected."


          else

            echo "⚠️ Gitleaks result unknown."

            FAIL=true

          fi


          echo "========================================="


          # ===============================================================
          # FINAL RESULT
          # ===============================================================

          if [ "$FAIL" = "true" ]; then

            echo "Overall Status: ❌ FAIL"

            exit 1


          else

            echo "Overall Status: ✅ PASS"

          fi